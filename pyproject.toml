[project]
name = "your-project"
version = "0.1.0"
requires-python = "==3.12.0"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "opencv-python",
    "tensorboard",
    "pandas",
    "debugpy",
    "pytest",
    "pre-commit",
    "nuscenes-devkit>=1.1.9",
    "pyvista>=0.48.4",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
include_trailing_comma = true
line_length = 120
multi_line_output = 3

[tool.pycln]
all = true
